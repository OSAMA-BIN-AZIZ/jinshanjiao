name: Expand freedom source

on:
  push:
    branches:
      - backup-main-before-rollback-20260817
    paths:
      - 'freedom/patch-v1.6.9.py'
      - '.github/workflows/expand-freedom-source.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v1.6.9 patch
        run: python3 freedom/patch-v1.6.9.py
      - name: Validate source
        run: php -l freedom/secure-tutorial-download.php
      - name: Commit synchronized source
        run: |
          if git diff --quiet -- freedom/secure-tutorial-download.php; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add freedom/secure-tutorial-download.php
          git commit -m "Sync freedom v1.6.9 source"
          git push
