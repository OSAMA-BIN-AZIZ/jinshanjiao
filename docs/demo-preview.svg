    <text x="0" y="272" font-family="Arial, sans-serif" font-size="20" fill="#475569">右下角悬浮 AI 在线客服，适合汽车配件咨询、报价引导、</text>
    <text x="0" y="306" font-family="Arial, sans-serif" font-size="20" fill="#475569">售后分流和人工客服线索收集。</text>
    <g filter="url(#cardShadow)">
      <rect x="0" y="360" width="220" height="132" rx="22" fill="white" fill-opacity="0.78" stroke="#94a3b8" stroke-opacity="0.24"/>
      <text x="22" y="402" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#d71920">车型适配咨询</text>
      <text x="22" y="438" font-family="Arial, sans-serif" font-size="15" fill="#334155">确认车型、年份、</text>
      <text x="22" y="464" font-family="Arial, sans-serif" font-size="15" fill="#334155">发动机型号与配件。</text>
      <rect x="244" y="360" width="220" height="132" rx="22" fill="white" fill-opacity="0.78" stroke="#94a3b8" stroke-opacity="0.24"/>
      <text x="266" y="402" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#d71920">报价采购引导</text>
      <text x="266" y="438" font-family="Arial, sans-serif" font-size="15" fill="#334155">收集数量、规格、</text>
      <text x="266" y="464" font-family="Arial, sans-serif" font-size="15" fill="#334155">城市与联系方式。</text>
      <rect x="488" y="360" width="220" height="132" rx="22" fill="white" fill-opacity="0.78" stroke="#94a3b8" stroke-opacity="0.24"/>
      <text x="510" y="402" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#d71920">售后问题分流</text>
      <text x="510" y="438" font-family="Arial, sans-serif" font-size="15" fill="#334155">引导描述订单、</text>
      <text x="510" y="464" font-family="Arial, sans-serif" font-size="15" fill="#334155">故障现象和图片。</text>
