    <text x="884" y="329" font-family="Arial, sans-serif" font-size="14" fill="#111827">您可以咨询汽车配件型号和报价。</text>
    <rect x="938" y="366" width="274" height="48" rx="14" fill="#d71920"/>
    <text x="958" y="397" font-family="Arial, sans-serif" font-size="14" fill="white">我想找 2018 年卡罗拉刹车片。</text>
    <rect x="868" y="434" width="324" height="92" rx="14" fill="white"/>
    <text x="884" y="463" font-family="Arial, sans-serif" font-size="14" fill="#111827">可以的。请提供排量、前后轮、</text>
    <text x="884" y="487" font-family="Arial, sans-serif" font-size="14" fill="#111827">采购数量和收货城市，我会帮您</text>
    <text x="884" y="511" font-family="Arial, sans-serif" font-size="14" fill="#111827">整理给人工客服确认库存和报价。</text>
    <line x1="850" y1="648" x2="1230" y2="648" stroke="#e2e8f0"/>
    <rect x="864" y="662" width="252" height="44" rx="12" fill="white" stroke="#cbd5e1"/>
    <text x="878" y="690" font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">请输入您的问题...</text>
    <rect x="1126" y="662" width="80" height="44" rx="12" fill="#d71920"/>
    <text x="1153" y="690" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="white">发送</text>
