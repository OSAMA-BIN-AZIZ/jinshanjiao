<svg width="1280" height="800" viewBox="0 0 1280 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7ed"/>
      <stop offset="0.55" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="brand" x1="890" y1="190" x2="1200" y2="736" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#d71920"/>
    </linearGradient>
    <linearGradient id="button" x1="940" y1="700" x2="1198" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d71920"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <filter id="shadow" x="820" y="140" width="420" height="650" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="35" flood-color="#0f172a" flood-opacity="0.24"/>
    </filter>
    <filter id="cardShadow" x="40" y="360" width="760" height="180" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="25" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <g transform="translate(72 92)">
    <rect width="192" height="44" rx="22" fill="#fee2e2" fill-opacity="0.9"/>
