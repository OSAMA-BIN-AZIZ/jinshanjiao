  <rect x="950" y="704" width="208" height="56" rx="28" fill="url(#button)" opacity="0.98"/>
  <circle cx="980" cy="732" r="15" fill="white" fill-opacity="0.22"/>
  <text x="972" y="737" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="white">AI</text>
  <text x="1006" y="738" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="white">在线客服</text>
</svg>
