    <path d="M850 194C850 182.954 858.954 174 870 174H1210C1221.05 174 1230 182.954 1230 194V252H850V194Z" fill="url(#brand)"/>
    <text x="874" y="213" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white">金三角智能客服</text>
    <text x="874" y="236" font-family="Arial, sans-serif" font-size="12" fill="white" fill-opacity="0.82">通常几秒内回复</text>
    <circle cx="1196" cy="213" r="17" fill="white" fill-opacity="0.16"/>
    <text x="1188" y="221" font-family="Arial, sans-serif" font-size="24" fill="white">×</text>
    <rect x="850" y="252" width="380" height="396" fill="#f8fafc"/>
    <rect x="868" y="276" width="302" height="70" rx="14" fill="white"/>
